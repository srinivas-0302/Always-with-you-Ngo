{% extends 'ngo_app/base.html' %}
{% block title %}Register - Always With You{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg border-0">
        <div class="card-header text-center bg-gradient">
          <h3>Signup</h3>
        </div>
        <div class="card-body">
          <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="text-center">
              <button type="submit" class="btn btn-gradient px-4">Register</button>
            </div>
          </form>
          <p class="text-center mt-3">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
