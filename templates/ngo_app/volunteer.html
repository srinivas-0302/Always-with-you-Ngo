{% extends 'ngo_app/base.html' %}
{% block title %}Volunteer - Always With You{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-lg border-0 mt-4">
      <div class="card-header"><h3>🤝 Become a Volunteer</h3></div>
      <div class="card-body">
        {% if success %}
          <div class="alert alert-success text-center">
            Thank you, {{ name }}! Your details have been submitted successfully 💖
          </div>
        {% endif %}
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" name="phone" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Reason to Volunteer</label>
            <textarea name="reason" class="form-control" rows="4" required></textarea>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-gradient px-4">Submit</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
