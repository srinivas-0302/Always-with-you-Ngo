{% extends 'ngo_app/base.html' %}
{% block title %}Donate - Always With You{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card mt-5 shadow-lg border-0">
      <div class="card-header"><h3>💝 Make a Donation</h3></div>
      <div class="card-body">
        {% if success %}
          <div class="alert alert-success text-center">
            Thank you, {{ name }}! Your donation of ₹{{ amount }} means a lot 💕
          </div>
        {% endif %}
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" placeholder="Your full name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Amount (₹)</label>
            <input type="number" name="amount" class="form-control" placeholder="Enter amount" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Payment Method</label>
            <select name="payment_method" class="form-select" required>
              <option value="UPI">UPI</option>
              <option value="Credit Card">Credit Card</option>
              <option value="Net Banking">Net Banking</option>
            </select>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-gradient px-4">Donate</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
